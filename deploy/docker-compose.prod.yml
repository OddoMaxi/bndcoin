# Production stack for Bory & Norbert.
#
#   cd deploy
#   cp .env.prod.example .env   # then edit secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api pnpm --filter @bn/api db:seed
#
# Caddy publishes 80/443 and obtains TLS automatically for the domain in ./Caddyfile.

name: bndcoin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: prod
    restart: unless-stopped
    command: >
      sh -c "pnpm --filter @bn/api exec prisma migrate deploy && node apps/api/dist/main.js"
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_TTL: "604800"
      PAYMENT_PROVIDER: mock
      CRYPTO_PROVIDER: mock
      MOCK_PROVIDERS_ENABLED: ${MOCK_PROVIDERS_ENABLED:-true}
      PAYMENT_WINDOW_SECONDS: "900"
      CRYPTO_REQUIRED_CONFIRMATIONS: "3"
      CORS_ORIGIN: ${PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}/api/v1
        NEXT_PUBLIC_MOCK_ENABLED: ${MOCK_PROVIDERS_ENABLED:-true}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_PORT: "3000"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
