# Isolated infra for the API e2e suite. Kept on non-default ports so it can run
# alongside the dev stack.
#
#   docker compose -f docker-compose.test.yml up -d
#   pnpm --filter @bn/api test:e2e
#   docker compose -f docker-compose.test.yml down -v
#
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bn
      POSTGRES_PASSWORD: bn_dev_password
      POSTGRES_DB: bory_norbert_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bn -d bory_norbert_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
